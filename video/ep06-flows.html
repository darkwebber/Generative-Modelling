<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normalizing Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Karla:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#13100e; --surface:#1c1816; --elevated:#272220; --border:#3a3432; --chalk:#ede6db; --stone:#a89f97; --dust:#6b6360; --terracotta:#c4654a; }
  html, body { margin:0; background:var(--canvas); color:var(--stone); font-family:'Karla',sans-serif; }

  canvas { width:100%; height:auto; display:block; border-radius:10px; background:var(--canvas); }
  .ctl { display:flex; gap:12px; align-items:center; margin-top:12px; }

  button:hover { border-color:var(--terracotta); }
  input[type=range] { flex:1; accent-color:var(--terracotta); min-width:0; }
  .time { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--dust); min-width:104px; text-align:right; }
  .chapters { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chapters button { font-size:11px; padding:4px 10px; border-radius:20px; color:var(--stone); }
  .chapters button.on { color:var(--terracotta); border-color:var(--terracotta); }
  body.capture .ctl, body.capture .chapters { display:none; }
  body.capture .wrap { padding:0; max-width:none; }
  body.capture canvas { width:1920px; border-radius:0; }

</head>
<body>
<div class="wrap">
  <canvas id="c" width="1920" height="1080" aria-label="Normalizing Flows explainer animation"></canvas>
  <div class="ctl">
    <button id="play">▶ play</button>
    <input id="scrub" type="range" min="0" max="1000" step="0.1" value="0" aria-label="timeline">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="chapters" id="chapters"></div>
</div>
<script src="ep06-assets.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
//  Midnight Atelier tokens + engine (shared across episodes)
// ─────────────────────────────────────────────────────────────
const P = {
  canvas:"#13100e", surface:"#1c1816", elevated:"#272220", border:"#3a3432", borderLight:"#4d4540",
  chalk:"#ede6db", stone:"#a89f97", dust:"#6b6360",
  terracotta:"#c4654a", sage:"#7a9e7e", ink:"#6889b1", amber:"#d4a853", clay:"#a0735c", rose:"#b5707e", plum:"#8b7bb5",
};
const F = { serif:"'Newsreader', Georgia, serif", sans:"'Karla', sans-serif", mono:"'JetBrains Mono', monospace" };
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, d) => clamp((t - a) / d);
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const ein = x => { x = clamp(x); return x * x * x; };
const pop = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const HX = {};
function hx(h) { return HX[h] || (HX[h] = (n => [n >> 16, (n >> 8) & 255, n & 255])(parseInt(h.slice(1), 16))); }
function rgba(h, a) { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

let GA = 1;
const setA = a => { ctx.globalAlpha = clamp(GA * a); };
function text(s, x, y, o = {}) {
  const { font = F.sans, size = 28, color = P.stone, align = 'left', a = 1, italic = false, weight = 400, ls = 0 } = o;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`;
  ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.fillStyle = color; setA(a);
  ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; ctx.textAlign = 'left'; setA(1);
}
function wrap(str, maxW, font) {
  ctx.font = font; const words = str.split(' '); const lines = []; let cur = '';

  if (cur) lines.push(cur); return lines;
}
function para(str, x, y, maxW, o = {}) {
  const { size = 24, lh = 1.45, color = P.stone, a = 1, font = F.sans, italic = false } = o;
  const lines = wrap(str, maxW, `${italic ? 'italic ' : ''}400 ${size}px ${font}`);
  lines.forEach((l, i) => text(l, x, y + i * size * lh, { font, size, color, a, italic }));
  return lines.length * size * lh;
}
const CM = { d:P.terracotta, p:P.ink, a:P.amber, n:P.rose, m:P.plum, s:P.sage, k:P.dust, w:P.chalk, c:P.clay, t:P.stone };
const MCACHE = new Map();
function parseM(str) {
  if (MCACHE.has(str)) return MCACHE.get(str);
  const out = []; const re = /\[([a-z])([_^B]?)\|([^\]]*)\]/g; let last = 0, m;
  while ((m = re.exec(str))) {
    if (m.index > last) out.push([str.slice(last, m.index), P.stone, '']);
    out.push([m[3], CM[m[1]], m[2] === '_' ? 's' : m[2] === '^' ? 'S' : m[2] === 'B' ? 'b' : '']);
    last = re.lastIndex;
  }
  if (last < str.length) out.push([str.slice(last), P.stone, '']);
  MCACHE.set(str, out); return out;
}
function M(str, x, y, size = 34, o = {}) {
  const { align = 'left', a = 1 } = o;
  const parts = parseM(str).map(([s, col, mod]) => {
    const sz = mod === 's' || mod === 'S' ? size * 0.66 : mod === 'b' ? size * 1.3 : size;
    ctx.font = `400 ${sz}px ${F.mono}`;
    return { s, col, sz, dy: mod === 's' ? size * 0.26 : mod === 'S' ? -size * 0.42 : mod === 'b' ? size * 0.1 : 0, w: ctx.measureText(s).width };
  });
  const total = parts.reduce((acc, p) => acc + p.w, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  setA(a); ctx.textAlign = 'left';
  for (const p of parts) { ctx.font = `400 ${p.sz}px ${F.mono}`; ctx.fillStyle = p.col; ctx.fillText(p.s, cx, y + p.dy); cx += p.w; }
  setA(1); return total;
}
function dot(x, y, r, col, a = 1) { setA(a); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); setA(1); }
function glow(x, y, r, col, a = 1) { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = r * 3.5; dot(x, y, r, col, a); ctx.restore(); }
function ring(x, y, r, col, a = 1, lw = 2) { setA(a); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.stroke(); setA(1); }
function line(x1, y1, x2, y2, col, lw = 2, a = 1, dash = null) { setA(a); ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); setA(1); }
function arrow(x1, y1, x2, y2, col, lw = 2, a = 1) {

  setA(a); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2, y2);

}
function rbox(x, y, w, h, r, fill, stroke, a = 1, lw = 1.5) { setA(a); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } setA(1); }
function card(x, y, w, h, accent, a = 1) {
  if (a <= 0) return;
  ctx.save(); setA(a);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fillStyle = rgba(P.surface, 0.86); ctx.fill();
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.clip(); ctx.fillStyle = rgba(accent, 0.6); ctx.fillRect(x, y, 4, h);
  ctx.restore(); setA(1);
}
function label(s, x, y, a = 1, color = P.terracotta) { text(s.toUpperCase(), x, y, { font: F.mono, size: 16, color, a, ls: 2 }); }
function tag(x, y, color, s, a = 1, size = 19) {
  ctx.font = `400 ${size}px ${F.mono}`; const w = ctx.measureText(s).width + size * 2.1; const h = size * 1.75;
  ctx.save(); setA(a);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fillStyle = rgba(color, 0.08); ctx.fill();
  ctx.strokeStyle = rgba(color, 0.3); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + size * 0.8, y + h / 2, size * 0.22, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillText(s, x + size * 1.35, y + h * 0.68);
  ctx.restore(); setA(1); return w;
}
function pill(x, y, s, color, a = 1, o = {}) {
  const { size = 20, align = 'left', font = F.mono } = o;
  ctx.font = `400 ${size}px ${font}`; const w = ctx.measureText(s).width + size * 1.2, h = size * 1.7;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.save(); setA(a); ctx.beginPath(); ctx.roundRect(x0, y - h / 2, w, h, h / 2);
  ctx.fillStyle = rgba(P.canvas, 0.85); ctx.fill(); ctx.strokeStyle = rgba(color, 0.45); ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = color; ctx.fillText(s, x0 + size * 0.6, y + size * 0.35); ctx.restore(); setA(1);
  return w;
}
function insight(x, y, w, s, a = 1, head = 'intuition') {
  if (a <= 0) return 0;
  const lines = wrap(s, w - 48, `400 25px ${F.sans}`); const h = 70 + lines.length * 35;
  ctx.save(); setA(a); ctx.beginPath(); ctx.roundRect(x, y, w, h, 16);
  ctx.fillStyle = rgba(P.sage, 0.07); ctx.fill(); ctx.strokeStyle = rgba(P.sage, 0.3); ctx.lineWidth = 1.3; ctx.stroke(); ctx.restore();
  text(head, x + 24, y + 38, { font: F.serif, italic: true, size: 22, color: P.sage, a });
  lines.forEach((l, i) => text(l, x + 24, y + 76 + i * 35, { size: 25, color: P.stone, a }));
  return h;
}
// a letter tile (data)
function tile(ch, x, y, s = 64, a = 1, o = {}) {
  const { col = P.terracotta, glowOn = false, fs = s * 0.58 } = o;
  if (a <= 0) return;
  ctx.save(); setA(a);
  if (glowOn) { ctx.shadowColor = col; ctx.shadowBlur = 18; }
  ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, s * 0.18); ctx.fillStyle = rgba(col, 0.12); ctx.fill();
  ctx.strokeStyle = rgba(col, 0.7); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  text(ch, x, y + fs * 0.36, { font: F.mono, size: fs, color: ch === '.' ? P.dust : P.chalk, align: 'center', a });
}
// bar chart over the 27 symbols
function bars27(p, x, y, w, h, o = {}) {
  const { a = 1, col = P.ink, hi = -1, hiCol = P.terracotta, labels = true, maxP = null, lab = 16 } = o;
  const mx = maxP || Math.max(...p); const bw = w / 27;
  for (let j = 0; j < 27; j++) {
    const bh = p[j] / mx * h; const isHi = j === hi;
    setA(a * (isHi ? 0.95 : 0.75)); ctx.fillStyle = isHi ? hiCol : col; ctx.fillRect(x + j * bw + 2, y - bh, bw - 4, bh);
    if (labels) text(VOC[j], x + j * bw + bw / 2, y + lab + 8, { font: F.mono, size: lab, color: isHi ? hiCol : P.dust, align: 'center', a });
  }
  setA(a); line(x, y, x + w, y, P.borderLight, 1.5, a);
}

// ─────────────────────────────────────────────────────────────
//  Real trained flows (exported by code/export_ep06_assets.py)
// ─────────────────────────────────────────────────────────────
const A = window.EP6, K = A.layers, RR = A.R;
function b64bytes(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const IMC = new Map();
function cached(key, make) { let c = IMC.get(key); if (!c) { c = make(); IMC.set(key, c); } return c; }
function densCanvas(d, col) { return cached('d' + d.max + ':' + d.u8.length + col, () => { const u = b64bytes(d.u8), n = d.n, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), im = g.createImageData(n, n), rgb = hx(col);
  for (let k = 0; k < n * n; k++) { im.data[k * 4] = rgb[0]; im.data[k * 4 + 1] = rgb[1]; im.data[k * 4 + 2] = rgb[2]; im.data[k * 4 + 3] = Math.round(u[k] * 0.92); } g.putImageData(im, 0, 0); return c; }); }
function square(x0, y0, S) { return { X: v => x0 + (v + RR) / (2 * RR) * S, Y: v => y0 + (RR - v) / (2 * RR) * S, s: S / (2 * RR), x0, y0, S }; }
function frame(m, a = 1) { setA(a); ctx.fillStyle = P.surface; ctx.fillRect(m.x0, m.y0, m.S, m.S); ctx.strokeStyle = P.border; ctx.lineWidth = 1.5; ctx.strokeRect(m.x0, m.y0, m.S, m.S); setA(1); }
function clipTo(m, fn) { ctx.save(); ctx.beginPath(); ctx.rect(m.x0, m.y0, m.S, m.S); ctx.clip(); fn(); ctx.restore(); }
function stageAt(stages, f) { const n = stages.length, fi = clamp(f, 0, n - 1), i = Math.floor(fi), j = Math.min(n - 1, i + 1), u = ease(fi - i); return [stages[i], stages[j], u]; }
function drawPts(m, stages, f, col, a, r = 2.6, colFn = null) { const [S0, S1, u] = stageAt(stages, f); for (let k = 0; k < S0.length; k++) { const x = lerp(S0[k][0], S1[k][0], u), y = lerp(S0[k][1], S1[k][1], u); if (Math.abs(x) < RR && Math.abs(y) < RR) dot(m.X(x), m.Y(y), r, colFn ? colFn(f) : col, a); } }
function drawGrid(m, f, a, col = P.borderLight) { const G = A.grid, [S0, S1, u] = stageAt(G.stages, f); setA(a); ctx.strokeStyle = col; ctx.lineWidth = 1.2;
  for (let l = 0; l < G.n; l++) { ctx.beginPath(); for (let k = 0; k < G.m; k++) { const i = l * G.m + k, x = lerp(S0[i][0], S1[i][0], u), y = lerp(S0[i][1], S1[i][1], u); k ? ctx.lineTo(m.X(x), m.Y(y)) : ctx.moveTo(m.X(x), m.Y(y)); } ctx.stroke(); } setA(1); }
const EX = A.example, sgn = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);

// ─────────────────────────────────────────────────────────────
//  SCENES
// ─────────────────────────────────────────────────────────────
const SC = [];

// 00 — cold open
SC.push({ dur: 24, chapter: 'intro',
  caps: [[0.6, 6, 'Pure noise goes in. Two moons come out. So far, nothing new…'],
         [6, 12, '…except that this time, run the machine backwards and every point returns exactly where it started.'],
         [12, 18, "A generator that runs both ways can answer the question a GAN couldn't: exactly how likely is this point?"],
         [18, 23.6, 'Today: normalizing flows.']],
  draw(t) {
    const dim = lerp(1, 0.16, ease(prog(t, 12.5, 1.5))), m = square(560, 200, 800);
    const f = t < 6 ? lerp(0, K, ease(prog(t, 0.5, 5))) : lerp(K, 0, ease(prog(t, 6.5, 5)));
    GA = dim; clipTo(m, () => { drawGrid(m, f, eout(prog(t, 0.3, 1)) * 0.6); drawPts(m, A.inv, f, null, 0.85, 2.6, ff => mixc(P.rose, P.terracotta, ff / K)); });

    const a = eout(prog(t, 13, 1.4));
    text('EPISODE 06', 960, 430, { font: F.serif, italic: true, size: 26, color: P.terracotta, align: 'center', a, ls: 4 });
    text('Normalizing Flows', 960, 550 + (1 - a) * 16, { font: F.serif, size: 124, color: P.chalk, align: 'center', a, ls: -1 });
    text('bending space, exactly', 960, 622, { size: 34, color: P.stone, align: 'center', a: eout(prog(t, 13.8, 1.2)) });
    const tg = [[P.terracotta, 'x  data'], [P.rose, 'z  noise'], [P.ink, 'p  density'], [P.amber, 's, t, det  stretch'], [P.plum, 'f  the flow']];
    ctx.font = `400 21px ${F.mono}`; const tw = tg.reduce((acc, [, s]) => acc + ctx.measureText(s).width + 21 * 2.1 + 14, -14);
    let cx = 960 - tw / 2; tg.forEach(([c, s], i) => { cx += tag(cx, 690, c, s, eout(prog(t, 16 + i * 0.35, 0.6)), 21) + 14; });
  } });

// 01 — conservation of sand (1-D)
const f1 = z => z + 0.7 * Math.sin(1.3 * z), df1 = z => 1 + 0.91 * Math.cos(1.3 * z);
const finv1 = x => { let lo = -8, hi = 8; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (f1(mid) < x) lo = mid; else hi = mid; } return (lo + hi) / 2; };
const nz = z => Math.exp(-z * z / 2) / Math.sqrt(TAU), px1 = x => { const z = finv1(x); return nz(z) / df1(z); };
SC.push({ dur: 44, chapter: 'sand', title: 'Probability is sand', sub: 'Move it around all you like — you can never create or destroy it.',
  caps: [[1, 8, 'Back to basics, in one dimension. Pour probability like sand along a line: a bell curve of noise, z.'],
         [8, 16, 'Now bend the line with a function x = f(z). Every grain moves, but none is created or destroyed.'],
         [16, 24, 'Take a thin slice of width dz. It holds p(z)·dz of sand. After the bend, the same sand sits in a slice of width dx.'],
         [24, 32, 'Same sand, so p(x)·dx = p(z)·dz, and p(x) = p(z)·|dz/dx|. Where f stretches space, the density thins; where it squeezes, it piles up.'],
         [32, 43.6, "That's episode 1's change of variables. But to use it on a data point x, we have to get back to its z — so f must be invertible."]],
  draw(t) {
    const zy = 780, xx = 620, ZX = z => 680 + (z + 3) * 100, XY = x => 780 - (x + 3.4) * 78, a0 = eout(prog(t, 0.6, 0.8));
    line(xx, zy, 1300, zy, P.borderLight, 2, a0); line(xx, zy, xx, 220, P.borderLight, 2, a0);

      setA(ca * 0.25); ctx.fillStyle = P.ink; ctx.beginPath(); ctx.moveTo(xx - 6, XY(-3.4)); for (let i = 0; i <= 200; i++) { const x = -3.4 + 6.8 * i / 200; ctx.lineTo(xx - 6 - px1(x) * 300, XY(x)); } ctx.lineTo(xx - 6, XY(3.4)); ctx.fill();
      setA(ca); ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i <= 200; i++) { const x = -3.4 + 6.8 * i / 200; i ? ctx.lineTo(xx - 6 - px1(x) * 300, XY(x)) : ctx.moveTo(xx - 6 - px1(x) * 300, XY(x)); } ctx.stroke(); setA(1);
      text('p(x)', xx - 250, XY(3.2), { font: F.mono, size: 22, color: P.ink, a: ca }); }

         [24, 32, 'The Jacobian is triangular — zeros above the diagonal — so its determinant is just the product of the diagonal: e^s(a). Cost: nothing.'],

    M('log |det| of the whole flow  =  [kB|Σ][k_|k] [a|s][a_|k]  — just add them up', 964, 815, 22, { a: c4 });
  } });
