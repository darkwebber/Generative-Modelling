<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13100e">
<title>Ep 05 · GANs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Karla:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#13100e; --surface:#1c1816; --elevated:#272220; --border:#3a3432; --chalk:#ede6db; --stone:#a89f97; --dust:#6b6360; --terracotta:#c4654a; --amber:#d4a853;
          --mono:'JetBrains Mono',monospace; --serif:'Newsreader',Georgia,serif; --u:0.6667px; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--canvas); color:var(--stone); font-family:'Karla',sans-serif; -webkit-tap-highlight-color:transparent; }
  html.noscroll, html.noscroll body { overflow:hidden; }
  .wrap { max-width:1280px; margin:0 auto; padding:16px 16px 40px; }
  button { font:inherit; color:inherit; }

  /* ── the player ── */
  .player { position:relative; outline:none; }
  .stage { position:relative; margin:0 auto; border-radius:12px; overflow:hidden; background:#0c0a09; user-select:none; -webkit-user-select:none; touch-action:manipulation;
           max-width:calc((100svh - 32px) * 16 / 9); }           /* a landscape phone: the picture fits the screen's height */
  canvas { width:100%; height:auto; display:block; background:var(--canvas); }
  .player.idle .stage { cursor:none; }
  .shade { position:absolute; inset:0; pointer-events:none; transition:opacity .35s; opacity:0;
           background:linear-gradient(to top, rgba(8,6,5,.82), rgba(8,6,5,.25) 22%, transparent 42%); }
  .player.show .shade { opacity:1; }
  .player:not(.started) .shade { opacity:1; background:radial-gradient(ellipse at 50% 60%, rgba(8,6,5,.15), rgba(8,6,5,.55)); }

  /* big centre button: before the first play, when paused, and on touch while the controls are up */
  .bigbtn { position:absolute; left:50%; top:50%; width:calc(var(--u) * 132); height:calc(var(--u) * 132); min-width:60px; min-height:60px; transform:translate(-50%,-50%); border-radius:50%;
            background:rgba(19,16,14,.72); border:2px solid var(--terracotta); color:var(--chalk); display:grid; place-items:center; cursor:pointer; padding:0;
            opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .bigbtn svg { width:42%; height:42%; }
  .player:not(.playing) .bigbtn, .player.touch.show .bigbtn { opacity:1; pointer-events:auto; }
  .player:not(.started) .bigbtn { top:80%; }               /* under the title card's text */
  .bigbtn:hover { transform:translate(-50%,-50%) scale(1.06); }
  .player.ended .bigbtn, .player.menu-open .bigbtn { opacity:0 !important; pointer-events:none !important; }
  .resume { position:absolute; left:max(10px, var(--u) * 28); top:max(10px, var(--u) * 26); padding:5px 12px; border-radius:16px; background:rgba(19,16,14,.82); border:1px solid var(--border);
            font-family:var(--mono); font-size:12px; color:var(--chalk); display:none; }
  .player:not(.started) .resume.on { display:block; }
  .resume button { background:none; border:0; color:var(--stone); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:12.5px; margin-left:6px; }

  /* flash on play/pause (mouse), skip bubbles (double-tap / keys) */
  .flash { position:absolute; left:50%; top:50%; width:72px; height:72px; margin:-36px 0 0 -36px; border-radius:50%; background:rgba(12,10,9,.6); color:var(--chalk); display:grid; place-items:center; opacity:0; pointer-events:none; }
  .flash svg { width:32px; height:32px; }
  .flash.go { animation:flash .55s ease-out; }
  @keyframes flash { 0% { opacity:.95; transform:scale(.8); } 100% { opacity:0; transform:scale(1.35); } }
  .skipfx { position:absolute; top:50%; transform:translateY(-50%); padding:10px 16px; border-radius:24px; background:rgba(12,10,9,.7); color:var(--chalk); font-family:var(--mono); font-size:14px; opacity:0; pointer-events:none; }
  .skipfx.l { left:8%; } .skipfx.r { right:8%; }
  .skipfx.go { animation:flash .6s ease-out; }
  .spin { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:3px solid rgba(237,230,219,.18); border-top-color:var(--terracotta); opacity:0; pointer-events:none; animation:spin .8s linear infinite; transition:opacity .2s; }
  .player.buffering .spin { opacity:1; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* captions: over the picture, or under it when the picture is too small to read them on */
  .cap { position:absolute; left:9.5%; right:9.5%; bottom:calc(var(--u) * 50); text-align:center; color:var(--chalk); pointer-events:none;
         font-size:max(14px, calc(var(--u) * 34)); line-height:1.3; text-shadow:0 0 calc(var(--u) * 14 + 3px) rgba(10,8,7,.98), 0 1px 2px rgba(10,8,7,.9); transition:transform .3s, opacity .15s; }
  .player.show.started .cap { transform:translateY(calc(-1 * max(64px, var(--u) * 96))); }
  .capb { display:none; min-height:3.2em; padding:10px 16px 0; text-align:center; color:var(--chalk); font-size:15.5px; line-height:1.45; transition:opacity .15s; }
  .player.below .cap { display:none; } .player.below.started .capb { display:block; }
  .player.narrow .chap, .player.narrow .vol input { display:none; }
  .player.narrow .chap + .ib { margin-left:auto; }
  .player.nocc .cap, .player.nocc .capb { display:none; }

  /* control bar */
  .bar { position:absolute; left:0; right:0; bottom:0; padding:0 max(10px, var(--u) * 24) max(6px, var(--u) * 12); opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s; pointer-events:none; }
  .player.show.started .bar { opacity:1; transform:none; pointer-events:auto; }
  .tl { position:relative; height:22px; cursor:pointer; touch-action:none; }
  .tl .track { position:absolute; left:0; right:0; top:9px; height:4px; border-radius:2px; background:rgba(237,230,219,.22); transition:height .15s, top .15s; }
  .tl:hover .track, .tl.drag .track { top:8px; height:6px; }
  .tl .fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:2px; background:var(--terracotta); }
  .tl .tick { position:absolute; top:-1px; bottom:-1px; width:3px; margin-left:-1.5px; background:rgba(12,10,9,.85); }
  .tl .knob { position:absolute; top:11px; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--chalk); box-shadow:0 0 0 3px rgba(196,101,74,.5); transform:scale(0); transition:transform .15s; }
  .tl:hover .knob, .tl.drag .knob, .player.touch .tl .knob { transform:scale(1); }
  .tip { position:absolute; bottom:26px; transform:translateX(-50%); white-space:nowrap; background:rgba(19,16,14,.94); border:1px solid var(--border); color:var(--chalk); font-family:var(--mono); font-size:11.5px; padding:4px 9px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .12s; }
  .tip.on { opacity:1; }
  .tip b { color:var(--terracotta); font-weight:400; }
  .row { display:flex; align-items:center; gap:2px; height:40px; }
  .ib { background:none; border:0; width:40px; height:40px; display:grid; place-items:center; border-radius:8px; color:var(--chalk); cursor:pointer; padding:0; flex:none; }
  .ib:hover { background:rgba(237,230,219,.1); }
  .ib:focus-visible, .tl:focus-visible, .bigbtn:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  .ib svg { width:22px; height:22px; }
  .ib.txt { width:auto; min-width:40px; padding:0 8px; font-family:var(--mono); font-size:12.5px; }
  .ib.cc { font-weight:600; letter-spacing:.04em; }
  .ib.cc span { border:1.6px solid currentColor; border-radius:4px; padding:1px 4px; font-size:10.5px; }
  .player.nocc .ib.cc { color:var(--dust); }
  .time { font-family:var(--mono); font-size:12.5px; color:var(--chalk); margin:0 8px 0 4px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .time span { color:var(--stone); }
  .chap { flex:1; min-width:0; background:none; border:0; padding:0 6px; text-align:left; color:var(--stone); font-family:var(--mono); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .chap:hover { color:var(--chalk); }
  .vol { display:flex; align-items:center; }
  .vol input { width:0; opacity:0; transition:width .2s, opacity .2s; accent-color:var(--terracotta); margin:0; }
  .vol:hover input, .vol:focus-within input { width:72px; opacity:1; margin:0 6px 0 2px; }
  @media (hover:none) { .vol input { display:none; } }

  /* chapter menu (inside the picture, so it works in full screen) */
  .menu { position:absolute; right:max(10px, var(--u) * 24); bottom:calc(max(6px, var(--u) * 12) + 66px); width:min(320px, calc(100% - 20px)); max-height:calc(100% - 90px); overflow-y:auto;
          background:rgba(19,16,14,.96); border:1px solid var(--border); border-radius:12px; padding:6px; display:none; overscroll-behavior:contain; }
  .player.menu-open .menu { display:block; }
  .menu button { display:flex; width:100%; gap:10px; align-items:baseline; background:none; border:0; border-radius:8px; padding:8px 10px; color:var(--stone); font-family:var(--mono); font-size:12.5px; text-align:left; cursor:pointer; }
  .menu button:hover { background:rgba(237,230,219,.07); color:var(--chalk); }
  .menu button.on { color:var(--terracotta); }
  .menu button b { font-weight:400; color:var(--dust); width:22px; flex:none; }
  .menu button span { flex:1; }
  .menu button time { color:var(--dust); font-size:11.5px; }

  /* end screen */
  .end { position:absolute; inset:0; display:none; place-items:center; background:rgba(12,10,9,.78); padding:16px; }
  .player.ended .end { display:grid; }
  .player.ended .bar, .player.ended .cap { opacity:0 !important; pointer-events:none !important; }
  .player.below .end h2, .player.below .end p { display:none; }   /* a phone-sized picture: just the next steps */
  .player.below .end .acts { gap:8px; } .player.below .end a, .player.below .end button.act, .player.below .end .soon { padding:7px 12px; font-size:12px; }
  .end .in { width:min(560px, 100%); text-align:center; }
  .end .k { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--terracotta); }
  .end h2 { font-family:var(--serif); font-weight:400; color:var(--chalk); font-size:clamp(20px, 3.2vw, 32px); margin:6px 0 4px; }
  .end p { margin:0 0 16px; font-size:14px; }
  .end .acts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .end a, .end button.act { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:22px; border:1px solid var(--border); background:var(--surface); color:var(--chalk); font-family:var(--mono); font-size:13px; text-decoration:none; cursor:pointer; }
  .end a.primary { border-color:var(--terracotta); background:rgba(196,101,74,.16); }
  .end a.lab { border-color:rgba(212,168,83,.55); color:var(--amber); }
  .end .soon { font-family:var(--mono); font-size:13px; color:var(--dust); font-style:italic; padding:10px 6px; }

  /* full screen: real, or a fixed overlay where the browser can't (iPhone, some embeds) */
  .player:fullscreen, .player.pseudo { background:#000; display:flex; flex-direction:column; justify-content:center; }
  .player:-webkit-full-screen { background:#000; display:flex; flex-direction:column; justify-content:center; width:100%; height:100%; }
  .player.pseudo { position:fixed; inset:0; z-index:1000; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .player:fullscreen .stage, .player.pseudo .stage { border-radius:0; max-width:none; }
  .player:-webkit-full-screen .stage { border-radius:0; max-width:none; }
  .player:fullscreen .capb, .player.pseudo .capb { display:none !important; }

  /* ── below the player ── */
  .info { margin:18px 2px 0; }
  .info .k { font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--terracotta); }
  .info h1 { font-family:var(--serif); font-weight:400; color:var(--chalk); font-size:clamp(24px, 3.4vw, 34px); line-height:1.15; margin:4px 0 4px; letter-spacing:-.01em; }
  .info .q { font-family:var(--serif); font-style:italic; font-size:clamp(16px, 2vw, 19px); margin:0; }
  .keys { font-family:var(--mono); font-size:11.5px; color:var(--dust); margin:10px 0 0; }
  .keys kbd { font:inherit; color:var(--stone); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:0 5px; }
  @media (hover:none) { .keys { display:none; } }
  .chlabel { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dust); margin:22px 2px 8px; }
  .chapters { display:flex; flex-wrap:wrap; gap:6px; }
  .chapters button { display:inline-flex; gap:8px; align-items:baseline; background:var(--surface); color:var(--stone); border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-family:var(--mono); font-size:12px; cursor:pointer; white-space:nowrap; scroll-snap-align:start; }
  .chapters button:hover { border-color:var(--terracotta); color:var(--chalk); }
  .chapters button time { color:var(--dust); font-size:11px; }
  .chapters button.on { color:var(--terracotta); border-color:var(--terracotta); }
  .links { display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:22px; padding-top:14px; border-top:1px solid var(--border); font-family:var(--mono); font-size:12.5px; }
  .links a { color:var(--stone); text-decoration:none; border-bottom:1px solid var(--border); padding-bottom:1px; }
  .links a:hover { color:var(--chalk); border-color:var(--terracotta); }
  .links a.lab { color:var(--amber); border-color:rgba(212,168,83,.45); }
  .links a.next, .links .soon.next { margin-left:auto; }
  .links .soon { color:var(--dust); font-style:italic; }

  @media (max-width: 640px) {
    .wrap { padding:0 0 32px; }
    .stage { border-radius:0; }
    .info, .chlabel { margin-left:16px; margin-right:16px; }
    .chapters { flex-wrap:nowrap; overflow-x:auto; padding:0 16px 6px; scroll-snap-type:x proximity; scrollbar-width:none; }
    .chapters::-webkit-scrollbar { display:none; }
    .links { margin:22px 16px 0; flex-direction:column; gap:12px; }
    .links a, .links .soon { align-self:flex-start; padding:2px 0; }
    .links a.next, .links .soon.next { margin-left:0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* rendering to MP4: the bare picture, captions and progress drawn on the canvas */
  body.capture .wrap { padding:0; max-width:none; }
  body.capture .stage { border-radius:0; max-width:none; width:1920px; }
  body.capture canvas { width:1920px; }
  body.capture .stage > :not(canvas), body.capture .capb, body.capture .info, body.capture .chlabel, body.capture .chapters, body.capture .links { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player" id="player" tabindex="-1">
    <div class="stage" id="stage">
      <canvas id="c" width="1920" height="1080" aria-label="Ep 05 · GANs explainer animation"></canvas>
      <div class="shade"></div>
      <div class="cap" id="cap" aria-hidden="true"></div>
      <div class="spin" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="skipfx l" id="skipl" aria-hidden="true">« 10 s</div>
      <div class="skipfx r" id="skipr" aria-hidden="true">10 s »</div>
      <button class="bigbtn" id="bigbtn" aria-label="play"></button>
      <div class="resume" id="resume"></div>
      <div class="menu" id="menu" role="menu" aria-label="chapters"></div>
      <div class="end" id="end"><div class="in" id="end-in"></div></div>
      <div class="bar" id="bar">
        <div class="tl" id="tl" role="slider" tabindex="0" aria-label="timeline" aria-valuemin="0">
          <div class="track"><div class="fill" id="fill"></div></div><div class="knob" id="knob"></div><div class="tip" id="tip"></div>
        </div>
        <div class="row">
          <button class="ib" id="play" aria-label="play (k)"></button>
          <div class="vol"><button class="ib" id="mute" aria-label="mute (m)"></button><input id="vol" type="range" min="0" max="1" step="0.05" aria-label="volume"></div>
          <span class="time" id="time">0:00 <span>/ 0:00</span></span>
          <button class="chap" id="chap" title="chapters"></button>
          <button class="ib cc" id="cc" aria-label="captions (c)" title="captions (c)"><span>CC</span></button>
          <button class="ib txt" id="rate" aria-label="playback speed" title="speed (&lt; &gt;)">1×</button>
          <button class="ib" id="chbtn" aria-label="chapters" title="chapters"></button>
          <button class="ib" id="fs" aria-label="full screen (f)" title="full screen (f)"></button>
        </div>
      </div>
    </div>
    <div class="capb" id="capb" aria-live="off"></div>
  </div>
  <header class="info" id="info"></header>
  <div class="chlabel">chapters</div>
  <div class="chapters" id="chapters"></div>
  <nav class="links" id="links" aria-label="season" hidden></nav>
  <audio id="snd" src="ep05-audio.mp3" preload="auto"></audio>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  Midnight Atelier engine — tokens, maths, drawing helpers.
//  Shared by every episode (src/build.py inlines it into each page).
//  Colour-coded maths:  M('[d|x] + [a_|θ] … [k^|2] … [pB|∫]')  d/p/a/n/m/s/k/w/c/t = colour, _ sub, ^ sup, B big
// ─────────────────────────────────────────────────────────────
const P = {
  canvas:"#13100e", surface:"#1c1816", elevated:"#272220", border:"#3a3432", borderLight:"#4d4540",
  chalk:"#ede6db", stone:"#a89f97", dust:"#6b6360",
  terracotta:"#c4654a", sage:"#7a9e7e", ink:"#6889b1", amber:"#d4a853", clay:"#a0735c", rose:"#b5707e", plum:"#8b7bb5",
};
const F = { serif:"'Newsreader', Georgia, serif", sans:"'Karla', sans-serif", mono:"'JetBrains Mono', monospace" };
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, d) => clamp((t - a) / d);
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const ein = x => { x = clamp(x); return x * x * x; };
const pop = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const HX = {};
function hx(h) { return HX[h] || (HX[h] = (n => [n >> 16, (n >> 8) & 255, n & 255])(parseInt(h.slice(1), 16))); }
function rgba(h, a) { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixc(a, b, u) { const A = hx(a), B = hx(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * u)},${Math.round(A[1] + (B[1] - A[1]) * u)},${Math.round(A[2] + (B[2] - A[2]) * u)})`; }

let GA = 1;
const setA = a => { ctx.globalAlpha = clamp(GA * a); };
function text(s, x, y, o = {}) {
  const { font = F.sans, size = 28, color = P.stone, align = 'left', a = 1, italic = false, weight = 400, ls = 0 } = o;
  if (GA * a <= 0.002) return;  // skip invisible draws (some browsers ignore globalAlpha = 0)
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`;
  ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.fillStyle = color; setA(a);
  ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; ctx.textAlign = 'left'; setA(1);
}
function wrap(str, maxW, font) {
  ctx.font = font; const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function para(str, x, y, maxW, o = {}) {
  const { size = 24, lh = 1.45, color = P.stone, a = 1, font = F.sans, italic = false } = o;
  const lines = wrap(str, maxW, `${italic ? 'italic ' : ''}400 ${size}px ${font}`);
  lines.forEach((l, i) => text(l, x, y + i * size * lh, { font, size, color, a, italic }));
  return lines.length * size * lh;
}
const CM = { d:P.terracotta, p:P.ink, a:P.amber, n:P.rose, m:P.plum, s:P.sage, k:P.dust, w:P.chalk, c:P.clay, t:P.stone };
const MCACHE = new Map();
function parseM(str) {
  if (MCACHE.has(str)) return MCACHE.get(str);
  const out = []; const re = /\[([a-z])([_^B]?)\|([^\]]*)\]/g; let last = 0, m;
